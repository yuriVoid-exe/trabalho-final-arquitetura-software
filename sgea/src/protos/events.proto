syntax = "proto3";

package sgea.events;

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  ACADEMIC_WEEK = 1;
  LECTURE = 2;
  MINICOURSE = 3;
  WORKSHOP = 4;
}

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  APPROVED = 2;
  REJECTED = 3;
  CANCELLED = 4;
}

service EventsService {
  // Criação e edição (Organizador / Admin)
  rpc CreateEvent (CreateEventRequest) returns (EventResponse);
  rpc UpdateEvent (UpdateEventRequest) returns (EventResponse);

  // Aprovação ou rejeição (Admin)
  rpc ReviewEvent (ReviewEventRequest) returns (EventResponse);

  // Consultas
  rpc GetEvent (GetEventRequest) returns (EventResponse);
  rpc ListEvents (ListEventsRequest) returns (ListEventsResponse);

  // Controle transacional de vagas (usado pelo Orquestrador no fluxo de inscrição)
  rpc ReserveSeat (SeatOperationRequest) returns (EventResponse);
  rpc ReleaseSeat (SeatOperationRequest) returns (EventResponse);

  // Dados agregados para relatórios gerais (Admin)
  rpc GetEventsSummary (GetEventsSummaryRequest) returns (EventsSummaryResponse);
}

message CreateEventRequest {
  string title = 1;
  string description = 2;
  EventType event_type = 3;
  string location = 4;
  string start_time = 5; // ISO-8601 UTC
  string end_time = 6;   // ISO-8601 UTC
  int32 capacity = 7;
  string organizer_id = 8;
}

message UpdateEventRequest {
  string event_id = 1;
  string requester_id = 2;
  bool requester_is_admin = 3;
  string title = 4;
  string description = 5;
  EventType event_type = 6;
  string location = 7;
  string start_time = 8;
  string end_time = 9;
  int32 capacity = 10;
}

message ReviewEventRequest {
  string event_id = 1;
  bool approve = 2; // true = APPROVED, false = REJECTED
}

message GetEventRequest {
  string event_id = 1;
}

message ListEventsRequest {
  EventStatus status_filter = 1;    // UNSPECIFIED = sem filtro
  EventType event_type_filter = 2;  // UNSPECIFIED = sem filtro
  string organizer_id = 3;          // vazio = sem filtro
}

message SeatOperationRequest {
  string event_id = 1;
}

message EventResponse {
  string event_id = 1;
  string title = 2;
  string description = 3;
  EventType event_type = 4;
  string location = 5;
  string start_time = 6;
  string end_time = 7;
  int32 capacity = 8;
  int32 occupied_seats = 9;
  int32 available_seats = 10;
  string organizer_id = 11;
  EventStatus status = 12;
  string created_at = 13;
}

message ListEventsResponse {
  repeated EventResponse events = 1;
}

message GetEventsSummaryRequest {}

message EventsSummaryResponse {
  int32 total_events = 1;
  int32 pending_events = 2;
  int32 approved_events = 3;
  int32 rejected_events = 4;
  int32 total_capacity = 5;
  int32 total_occupied_seats = 6;
}
